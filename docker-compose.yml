services:
  nginx:
    image: nginx:alpine
    container_name: shortforge_nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shortforge_frontend
    restart: always
    environment:
      - VITE_API_URL=http://localhost:8001

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shortforge_backend
    restart: always
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://shortforge:shortforge_pass@postgres:5432/shortforge
      - REDIS_URL=redis://redis:6379/0
      - INPUT_DIR=/app/input
      - PROCESSING_DIR=/app/processing
      - OUTPUT_DIR=/app/output
      - ARCHIVE_DIR=/app/archive
      - LOGS_DIR=/app/logs
      - FONTS_DIR=/app/fonts
    volumes:
      - ./input:/app/input
      - ./processing:/app/processing
      - ./output:/app/output
      - ./archive:/app/archive
      - ./logs:/app/logs
      - ./fonts:/app/fonts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shortforge_worker
    restart: always
    command: celery -A app.worker.celery_app worker --loglevel=info -c 4
    environment:
      - DATABASE_URL=postgresql+asyncpg://shortforge:shortforge_pass@postgres:5432/shortforge
      - REDIS_URL=redis://redis:6379/0
      - INPUT_DIR=/app/input
      - PROCESSING_DIR=/app/processing
      - OUTPUT_DIR=/app/output
      - ARCHIVE_DIR=/app/archive
      - LOGS_DIR=/app/logs
      - FONTS_DIR=/app/fonts
    volumes:
      - ./input:/app/input
      - ./processing:/app/processing
      - ./output:/app/output
      - ./archive:/app/archive
      - ./logs:/app/logs
      - ./fonts:/app/fonts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: shortforge_redis
    restart: always
    ports:
      - "6380:6379"

  postgres:
    image: postgres:16-alpine
    container_name: shortforge_postgres
    restart: always
    environment:
      POSTGRES_USER: shortforge
      POSTGRES_PASSWORD: shortforge_pass
      POSTGRES_DB: shortforge
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortforge -d shortforge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
